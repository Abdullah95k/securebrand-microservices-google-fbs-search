name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector on)
        run: go test -race -count=1 ./...
      - name: No credentials, proxy addresses or result files committed
        run: |
          if git ls-files | grep -E '(^|/)(secrets/|out/)|\.csv$|(^|/)proxies\.yaml$|\.key$'; then
            echo "files that must never be committed are tracked"; exit 1
          fi
          # URLs carrying a user name and password, except
          # the user:pass@host placeholder; tests use documentation addresses.
          if git grep -nE '[a-z0-9]+://[^/ "]+:[^/ "@]+@[0-9a-z.-]+' -- ':!*_test.go' | grep -v 'user:pass@host'; then
            echo "something that looks like a URL with credentials is committed"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
